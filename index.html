<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interneti Turvalisuse Teejuht</title>
    <style>
        :root {
            --bg-color: #121820;
            --text-color: #e2e8f0;
            --card-bg: #1e293b;
            --card-border: #3b82f6;
            --button-bg: #334155;
            --button-text: #ffffff;
            --btn-accent: #2563eb; /* UUS: professionaalne nupu värv */
            --btn-game: #10b981; /* Roheline värv mängunupule */
        }

        [data-theme="light"] {
            --bg-color: #ffffff;
            --text-color: #1e293b;
            --card-bg: #f8fafc;
            --card-border: #0284c7;
            --button-bg: #e2e8f0;
            --button-text: #1e293b;
            --btn-accent: #0284c7; /* UUS: hele režiimi nupu värv */
            --btn-game: #059669;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            line-height: 1.6;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }

        header {
            position: relative;
            margin-bottom: 40px;
            padding-right: 280px; /* Laiendatud, et nupud ära mahuksid */
        }

        /* Nuppude asetus ülal paremal */
        .header-controls {
            position: absolute;
            top: 0;
            right: 0;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .theme-toggle {
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            background-color: var(--button-bg);
            color: var(--button-text);
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9em;
            transition: opacity 0.2s;
        }

        /* Eaglercrafti nupu stiil puhta lingina */
        .game-btn {
            display: inline-block;
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            background-color: var(--btn-game);
            color: #ffffff !important;
            text-decoration: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9em;
            transition: opacity 0.2s;
        }

        .theme-toggle:hover, .game-btn:hover {
            opacity: 0.9;
        }

        .card {
            background-color: var(--card-bg);
            padding: 20px;
            border-left: 5px solid var(--card-border);
            margin: 25px 0;
            border-radius: 6px;
            transition: background-color 0.3s;
            white-space: pre-wrap;
        }

        /* UUS: Puhta ja lihtsa nupu disain, ilma AI-like emotikonideta */
        .custom-link-btn {
            display: inline-block;
            margin-top: 12px;
            padding: 8px 18px;
            background-color: var(--btn-accent);
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9em;
            transition: opacity 0.2s;
        }

        .custom-link-btn:hover {
            opacity: 0.9;
        }

        .pealkiri-blokk {
            margin-top: 40px;
            margin-bottom: 15px;
            white-space: pre-wrap;
        }

        footer {
            margin-top: 60px;
            font-size: 0.85em;
            text-align: center;
            opacity: 0.7;
            border-top: 1px solid var(--button-bg);
            padding-top: 20px;
        }
    </style>
</head>
<body data-theme="dark">

    <header>
        <h1 id="lehe-pealkiri">Interneti Turvalisuse Teejuht</h1>
        <p id="lehe-alapealkiri">Praktilised nõuanded ja põhitõed end veebis kaitsmiseks.</p>
        
        <div class="header-controls">
            <a href="https://matueagler.duckdns.org" target="_blank" class="game-btn">Mängi Eaglercrafti</a>
            <button class="theme-toggle" id="themeBtn">Hele režiim</button>
        </div>
    </header>

    <main id="sisu-konteiner">
        <p id="laadimis-tekst">Laen sisu...</p>
    </main>

    <footer>
        <p>© 2026 Interneti Turvalisuse Projekt • Kõik õigused kaitstud.</p>
    </footer>

    <script>
        const themeBtn = document.getElementById('themeBtn');
        const body = document.body;

        themeBtn.addEventListener('click', () => {
            const currentTheme = body.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                body.setAttribute('data-theme', 'light');
                themeBtn.textContent = 'Tume režiim';
            } else {
                body.setAttribute('data-theme', 'dark');
                themeBtn.textContent = 'Hele režiim';
            }
        });

        const margised = ['{pealkiri}', '{peatükk1}', '{peatükk2}', '{peatükk3}', '{peatükk4}', '{peatükk5}', '{peatükk6}', '{peatükk7}', '{peatükk8}', '{peatükk9}', '{peatükk10}'];
        const lingidFailiAadress = 'https://raw.githubusercontent.com/SilentClutchPlays-projekts/database/refs/heads/main/lingid.txt';

        async function uuendaVeebileheSisu() {
            const konteiner = document.getElementById('sisu-konteiner');
            let laetudSisu = [];

            try {
                const resLingid = await fetch(lingidFailiAadress + '?v=' + Date.now());
                if (!resLingid.ok) {
                    console.error('Ei saanud lingid.txt faili kätte');
                    return;
                }

                const lingidTekst = await resLingid.text();
                
                const failiAllikad = lingidTekst.split('\n')
                    .map(rida => rida.trim())
                    .filter(rida => rida.length > 0);

                if (failiAllikad.length === 0) {
                    return;
                }

                for (const algneTee of failiAllikad) {
                    const resFail = await fetch(algneTee + '?v=' + Date.now());
                    if (!resFail.ok) continue;

                    let tekst = await resFail.text();
                    tekst = tekst.trim();

                    if (tekst === '') continue;

                    let leitudMargis = '{peatükk1}';
                    for (const m of margised) {
                        if (tekst.startsWith(m)) {
                            leitudMargis = m;
                            tekst = tekst.replace(m, '').trim();
                            break;
                        }
                    }

                    laetudSisu.push({
                        margis: leitudMargis,
                        sisu: tekst
                    });
                }

                laetudSisu.sort((a, b) => {
                    if (a.margis === '{pealkiri}') return -1;
                    if (b.margis === '{pealkiri}') return 1;
                    
                    const numbriA = parseInt(a.margis.replace(/\D/g, '')) || 0;
                    const numbriB = parseInt(b.margis.replace(/\D/g, '')) || 0;
                    return numbriA - numbriB;
                });

                konteiner.innerHTML = '';
                laetudSisu.forEach(item => {
                    const element = document.createElement('div');
                    if (item.margis === '{pealkiri}') {
                        element.className = 'pealkiri-blokk';
                        element.innerHTML = item.sisu;
                    } else {
                        element.className = 'card';
                        
                        // UUS: Asendab sinu failis oleva koodi {nupp;link:aadress} puhta nupuga
                        let toodeldudSisu = item.sisu.replace(/\{nupp;link:([^\s}]+)\}/g, function(match, url) {
                            let taisUrl = url.match(/^https?:\/\//) ? url : 'https://' + url;
                            return `<br><a href="${taisUrl}" target="_blank" class="custom-link-btn">Ava link</a>`;
                        });
                        
                        element.innerHTML = toodeldudSisu;
                    }
                    konteiner.appendChild(element);
                });

            } catch (error) {
                console.error('Viga sisu värskendamisel:', error);
            }
        }

        uuendaVeebileheSisu();
        setInterval(uuendaVeebileheSisu, 5000);
    </script>
</body>
</html>
