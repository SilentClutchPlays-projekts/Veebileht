<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interneti Turvalisuse Teejuht</title>
    <style>
        :root {
            --bg-color: #121820;
            --text-color: #e2e8f0;
            --card-bg: #1e293b;
            --card-border: #3b82f6;
            --button-bg: #334155;
            --button-text: #ffffff;
        }

        [data-theme="light"] {
            --bg-color: #ffffff;
            --text-color: #1e293b;
            --card-bg: #f8fafc;
            --card-border: #0284c7;
            --button-bg: #e2e8f0;
            --button-text: #1e293b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            line-height: 1.6;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }

        header {
            position: relative;
            margin-bottom: 40px;
            padding-right: 120px;
        }

        .theme-toggle {
            position: absolute;
            top: 0;
            right: 0;
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            background-color: var(--button-bg);
            color: var(--button-text);
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9em;
            transition: opacity 0.2s;
        }

        .theme-toggle:hover {
            opacity: 0.9;
        }

        .card {
            background-color: var(--card-bg);
            padding: 20px;
            border-left: 5px solid var(--card-border);
            margin: 25px 0;
            border-radius: 6px;
            transition: background-color 0.3s;
            white-space: pre-wrap;
        }

        .pealkiri-blokk {
            margin-top: 40px;
            margin-bottom: 15px;
            white-space: pre-wrap;
        }

        footer {
            margin-top: 60px;
            font-size: 0.85em;
            text-align: center;
            opacity: 0.7;
            border-top: 1px solid var(--button-bg);
            padding-top: 20px;
        }
    </style>
</head>
<body data-theme="dark">

    <header>
        <h1 id="lehe-pealkiri">Interneti Turvalisuse Teejuht</h1>
        <p id="lehe-alapealkiri">Praktilised nõuanded ja põhitõed end veebis kaitsmiseks.</p>
        <button class="theme-toggle" id="themeBtn">Hele režiim</button>
    </header>

    <main id="sisu-konteiner">
        <p id="laadimis-tekst">Laen sisu...</p>
    </main>

    <footer>
        <p>© 2026 Interneti Turvalisuse Projekt • Kõik õigused kaitstud.</p>
    </footer>

    <script>
        const themeBtn = document.getElementById('themeBtn');
        const body = document.body;

        themeBtn.addEventListener('click', () => {
            const currentTheme = body.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                body.setAttribute('data-theme', 'light');
                themeBtn.textContent = 'Tume režiim';
            } else {
                body.setAttribute('data-theme', 'dark');
                themeBtn.textContent = 'Hele režiim';
            }
        });

        const margised = ['{pealkiri}', '{peatükk1}', '{peatükk2}', '{peatükk3}', '{peatükk4}'];

        // Sinu uue sisu-repositooriumi püsivad RAW lingid
        const failiAllikad = [
            'https://raw.githubusercontent.com/SilentClutchPlays-projekts/database/refs/heads/main/pealkiri.txt',
            'https://raw.githubusercontent.com/SilentClutchPlays-projekts/database/refs/heads/main/1-peat%C3%BCkk.txt',
            'https://raw.githubusercontent.com/SilentClutchPlays-projekts/database/refs/heads/main/2-peat%C3%BCkk.txt',
            'https://raw.githubusercontent.com/SilentClutchPlays-projekts/database/refs/heads/main/3-peat%C3%BCkk.txt'
        ];

        async function laadiSisuExernal() {
            const konteiner = document.getElementById('sisu-konteiner');
            let laetudSisu = [];

            try {
                for (const algneTee of failiAllikad) {
                    // Lisame juhusliku parameetri, et vältida brauseri vahemälu vanu andmeid
                    const failiTee = algneTee + '?v=' + Date.now();
                    
                    const resFail = await fetch(failiTee);
                    if (!resFail.ok) continue;

                    let tekst = await resFail.text();
                    tekst = tekst.trim();

                    if (tekst === '') continue;

                    let leitudMargis = '{peatükk1}';
                    for (const m of margised) {
                        if (tekst.startsWith(m)) {
                            leitudMargis = m;
                            tekst = tekst.replace(m, '').trim();
                            break;
                        }
                    }

                    laetudSisu.push({
                        margis: leitudMargis,
                        sisu: tekst
                    });
                }

                // Sorteerime märgiste järgi: {pealkiri} kõige ette, edasi peatükkide järjekorras
                laetudSisu.sort((a, b) => {
                    if (a.margis === '{pealkiri}') return -1;
                    if (b.margis === '{pealkiri}') return 1;
                    return a.margis.localeCompare(b.margis);
                });

                if (laetudSisu.length === 0) {
                    document.getElementById('laadimis-tekst').textContent = 'Tekstifaile ei suudetud andmebaasist laadida.';
                    return;
                }

                konteiner.innerHTML = '';
                laetudSisu.forEach(item => {
                    const element = document.createElement('div');
                    if (item.margis === '{pealkiri}') {
                        element.className = 'pealkiri-blokk';
                        element.innerHTML = item.sisu;
                    } else {
                        element.className = 'card';
                        element.innerHTML = item.sisu;
                    }
                    konteiner.appendChild(element);
                });

            } catch (error) {
                console.error(error);
                document.getElementById('laadimis-tekst').textContent = 'Sisu laadimisel tekkis tõrge.';
            }
        }

        laadiSisuExernal();
    </script>
</body>
</html>
